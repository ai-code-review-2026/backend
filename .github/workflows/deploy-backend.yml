name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-review-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-review-api:${{ github.sha }}

  deploy:
    name: Deploy Backend on VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ai-review/backend
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-review-api:latest
            docker compose up -d --force-recreate
            sleep 30
            curl -sf http://127.0.0.1:8000/healthz
