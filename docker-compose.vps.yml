################################################################################
# AI Code Review Platform - Production VPS Deployment
# 
# Architecture complète optimisée pour production avec:
# - Persistance des données avec volumes nommés
# - Health checks robustes
# - Resource limits appropriés
# - Restart policies
# - Network isolation
# - Monitoring intégré
#
# Services déployés:
#   ✓ PostgreSQL 16      - Base de données relationnelle
#   ✓ Redis 7            - Cache et broker Celery
#   ✓ Neo4j 5            - Base de connaissances graphe (GraphRAG)
#   ✓ MinIO              - Stockage objet S3-compatible
#   ✓ FastAPI Backend    - API REST
#   ✓ Celery Worker      - Pipeline d'analyse asynchrone
#   ✓ Dashboard Next.js  - Interface utilisateur
#   ✓ YJS WebSocket      - Collaboration temps réel
#   ✓ Prometheus         - Métriques
#   ✓ Grafana            - Dashboards
#
# Usage:
#   docker compose -f docker-compose.vps.yml up -d
#   docker compose -f docker-compose.vps.yml logs -f
#   docker compose -f docker-compose.vps.yml down
#
# IMPORTANT: Configurer le fichier .env avant le déploiement
################################################################################

version: "3.9"

################################################################################
# NETWORKS
################################################################################
networks:
  ai-review-net:
    driver: bridge
    name: ai-review-production

################################################################################
# VOLUMES - Persistance des données
################################################################################
volumes:
  # Données de base
  postgres_data:
    driver: local
    name: ai-review-postgres-data
  redis_data:
    driver: local
    name: ai-review-redis-data
  neo4j_data:
    driver: local
    name: ai-review-neo4j-data
  neo4j_logs:
    driver: local
    name: ai-review-neo4j-logs
  minio_data:
    driver: local
    name: ai-review-minio-data
  
  # Workspace pour analyses
  analysis_workspace:
    driver: local
    name: ai-review-workspace
  
  # Monitoring
  prometheus_data:
    driver: local
    name: ai-review-prometheus-data
  grafana_data:
    driver: local
    name: ai-review-grafana-data
  
  # Reverse proxy
  caddy_data:
    driver: local
    name: ai-review-caddy-data
  caddy_config:
    driver: local
    name: ai-review-caddy-config

################################################################################
# ENVIRONMENT VARIABLES COMMUNES
################################################################################
x-backend-env: &backend-env
  # Environment
  ENV: production
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  
  # Database
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  
  # Redis & Celery
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  ANALYSIS_QUEUE_NAME: ${ANALYSIS_QUEUE_NAME:-analyses}
  
  # Neo4j (GraphRAG)
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  
  # MinIO (Object Storage)
  OBJECT_STORAGE_ENABLED: "true"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET:-ai-review-artifacts}
  MINIO_SECURE: "false"
  
  # GitHub
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
  GITHUB_APP_PRIVATE_KEY_PEM: ${GITHUB_APP_PRIVATE_KEY_PEM:-}
  GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
  
  # Clerk Authentication
  CLERK_AUTH_ENABLED: ${CLERK_AUTH_ENABLED:-true}
  CLERK_ISSUER_URL: ${CLERK_ISSUER_URL}
  CLERK_JWKS_URL: ${CLERK_JWKS_URL}
  CLERK_AUDIENCE: ${CLERK_AUDIENCE}
  CLERK_JWT_LEEWAY_SECONDS: ${CLERK_JWT_LEEWAY_SECONDS:-10}
  
  # Security
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
  RBAC_ENFORCEMENT_ENABLED: ${RBAC_ENFORCEMENT_ENABLED:-true}
  ADMIN_EMAILS: ${ADMIN_EMAILS}
  CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
  
  # Static Analysis
  STATIC_ANALYSIS_ENABLED: ${STATIC_ANALYSIS_ENABLED:-true}
  STATIC_ANALYSIS_GIT_TOKEN: ${STATIC_ANALYSIS_GIT_TOKEN}
  STATIC_ANALYSIS_TIMEOUT_SECONDS: ${STATIC_ANALYSIS_TIMEOUT_SECONDS:-120}
  STATIC_ANALYSIS_MAX_FILES: ${STATIC_ANALYSIS_MAX_FILES:-200}
  STATIC_ANALYSIS_MAX_FINDINGS: ${STATIC_ANALYSIS_MAX_FINDINGS:-200}
  STATIC_ANALYSIS_WORKSPACE_PATH: /var/ai-review/workspace
  
  # LLM Configuration
  LLM_ENABLED: ${LLM_ENABLED:-true}
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
  ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-4096}
  ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0.0}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  
  # Review Intelligence (GraphRAG)
  REVIEW_INTELLIGENCE_ENABLED: ${REVIEW_INTELLIGENCE_ENABLED:-true}
  
  # Notifications
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
  SLACK_ENABLED: ${SLACK_ENABLED:-false}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}

x-dashboard-env: &dashboard-env
  NODE_ENV: production
  PORT: "3001"
  BACKEND_API_URL: http://backend:8000
  NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
  NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
  NEXT_PUBLIC_BACKEND_URL: https://${API_DOMAIN}
  NEXT_PUBLIC_Y_WEBSOCKET_URL: wss://${YJS_DOMAIN}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
  ADMIN_EMAILS: ${ADMIN_EMAILS}

################################################################################
# SERVICES
################################################################################
services:

  # ============================================================================
  # INFRASTRUCTURE - Base de données et cache
  # ============================================================================

  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-review-postgres
    restart: unless-stopped
    networks:
      - ai-review-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-review-redis
    restart: unless-stopped
    networks:
      - ai-review-net
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Neo4j 5 (GraphRAG) ─────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.28-community
    container_name: ai-review-neo4j
    restart: unless-stopped
    networks:
      - ai-review-net
    ports:
      - "7474:7474"  # HTTP Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512M}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_connector_bolt_advertised__address: neo4j:7687
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── MinIO (S3-compatible Object Storage) ───────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: ai-review-minio
    restart: unless-stopped
    networks:
      - ai-review-net
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_DOMAIN:-minio.${APP_DOMAIN}}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # APPLICATION - Backend et Workers
  # ============================================================================

  # ─── FastAPI Backend (API Server) ───────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ai-review-backend:production
    container_name: ai-review-backend
    restart: unless-stopped
    networks:
      - ai-review-net
    command: >
      /bin/sh -c "
      echo 'Running database migrations...' &&
      alembic -c /app/alembic.ini upgrade head &&
      echo 'Starting FastAPI server...' &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "
    environment:
      <<: *backend-env
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      WORKERS_COUNT: 4
    volumes:
      - analysis_workspace:/var/ai-review/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ─── Celery Worker (Pipeline d'analyse asynchrone) ──────────────────────────
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: ai-review-backend:production
    container_name: ai-review-worker
    restart: unless-stopped
    networks:
      - ai-review-net
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=info
      -Q ${ANALYSIS_QUEUE_NAME:-analyses}
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-50}
      --pool=prefork
    environment:
      <<: *backend-env
      CELERY_WORKER_POOL: prefork
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      CELERY_MAX_TASKS_PER_CHILD: ${CELERY_MAX_TASKS_PER_CHILD:-50}
      PROMETHEUS_PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - analysis_workspace:/var/ai-review/workspace
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '1'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ============================================================================
  # FRONTEND - Dashboard et WebSocket
  # ============================================================================

  # ─── Dashboard Next.js ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_BACKEND_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_Y_WEBSOCKET_URL: wss://${YJS_DOMAIN}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    image: ai-review-dashboard:production
    container_name: ai-review-dashboard
    restart: unless-stopped
    networks:
      - ai-review-net
    environment:
      <<: *dashboard-env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── YJS WebSocket Server (Collaboration temps réel) ────────────────────────
  yjs:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_BACKEND_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_Y_WEBSOCKET_URL: wss://${YJS_DOMAIN}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    image: ai-review-dashboard:production
    container_name: ai-review-yjs
    restart: unless-stopped
    networks:
      - ai-review-net
    command: ["npm", "run", "start:y-websocket"]
    environment:
      <<: *dashboard-env
      PORT: "1234"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:1234').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # MONITORING - Métriques et Observabilité
  # ============================================================================

  # ─── Prometheus Pushgateway ─────────────────────────────────────────────────
  pushgateway:
    image: prom/pushgateway:v1.8.0
    container_name: ai-review-pushgateway
    restart: unless-stopped
    networks:
      - ai-review-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai-review-prometheus
    restart: unless-stopped
    networks:
      - ai-review-net
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - pushgateway
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ai-review-grafana
    restart: unless-stopped
    networks:
      - ai-review-net
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.${APP_DOMAIN}}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Flower (Celery Monitoring) ─────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: ai-review-flower
    restart: unless-stopped
    networks:
      - ai-review-net
    command: >
      celery
      --broker=redis://redis:6379/0
      flower
      --port=5555
      --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ============================================================================
  # REVERSE PROXY - Caddy avec SSL automatique
  # ============================================================================

  caddy:
    image: caddy:2.8-alpine
    container_name: ai-review-caddy
    restart: unless-stopped
    networks:
      - ai-review-net
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./infra/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
      backend:
        condition: service_healthy
      yjs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

################################################################################
# NOTES D'UTILISATION
################################################################################
# 
# 1. Démarrage complet:
#    docker compose -f docker-compose.vps.yml up -d
#
# 2. Voir les logs:
#    docker compose -f docker-compose.vps.yml logs -f backend
#    docker compose -f docker-compose.vps.yml logs -f worker
#
# 3. Redémarrer un service:
#    docker compose -f docker-compose.vps.yml restart backend
#
# 4. Scaling workers:
#    docker compose -f docker-compose.vps.yml up -d --scale worker=3
#
# 5. Backup des données:
#    docker run --rm -v ai-review-postgres-data:/data -v $(pwd):/backup \
#      alpine tar czf /backup/postgres-backup.tar.gz /data
#
# 6. Accès aux services:
#    - API:       https://${API_DOMAIN}
#    - Dashboard: https://${APP_DOMAIN}
#    - Neo4j UI:  https://${APP_DOMAIN}/neo4j (ou port 7474)
#    - Grafana:   https://grafana.${APP_DOMAIN}
#    - Flower:    https://flower.${APP_DOMAIN}
#
# 7. Monitoring santé:
#    docker compose -f docker-compose.vps.yml ps
#    docker compose -f docker-compose.vps.yml top
#
################################################################################
