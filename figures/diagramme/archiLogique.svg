<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px Arial, sans-serif; fill: #475569; }
      .layer-title { font: 700 25px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 19px Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #475569; }
      .small { font: 400 15px Arial, sans-serif; fill: #64748b; }
      .pill { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="2000" height="1400" fill="#f8fafc"/>
  <text x="90" y="78" class="title">Architecture logique de la plateforme Devora AI Code Review</text>
  <text x="90" y="120" class="subtitle">Organisation en couches : interfaces, API, coeur metier, workers, donnees et integrations externes</text>

  <rect x="70" y="155" width="1860" height="145" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="105" y="194" class="layer-title">Couche acteurs et canaux d'acces</text>
  <rect x="130" y="222" width="270" height="56" rx="12" fill="#0ea5e9"/>
  <text x="205" y="257" class="pill">Developpeur</text>
  <rect x="460" y="222" width="270" height="56" rx="12" fill="#0ea5e9"/>
  <text x="507" y="257" class="pill">Tech Lead / Reviewer</text>
  <rect x="790" y="222" width="270" height="56" rx="12" fill="#0ea5e9"/>
  <text x="894" y="257" class="pill">Admin</text>
  <rect x="1120" y="222" width="270" height="56" rx="12" fill="#0ea5e9"/>
  <text x="1194" y="257" class="pill">GitHub Events</text>
  <rect x="1450" y="222" width="300" height="56" rx="12" fill="#0ea5e9"/>
  <text x="1524" y="257" class="pill">VS Code Extension</text>

  <rect x="70" y="345" width="1860" height="165" rx="22" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="105" y="386" class="layer-title">Couche presentation</text>
  <rect x="130" y="420" width="390" height="68" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="446" class="box-title">Dashboard Web Next.js</text>
  <text x="160" y="472" class="box-text">PRs, analyses, reviews, analytics</text>
  <rect x="590" y="420" width="390" height="68" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="446" class="box-title">Application Mobile</text>
  <text x="620" y="472" class="box-text">Notifications, resumes, health</text>
  <rect x="1050" y="420" width="390" height="68" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1080" y="446" class="box-title">Extension VS Code</text>
