  <rect x="1510" y="420" width="270" height="68" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1540" y="446" class="box-title">Route Handlers</text>
  <text x="1540" y="472" class="box-text">Proxy frontend/API</text>

  <rect x="70" y="555" width="1860" height="165" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
