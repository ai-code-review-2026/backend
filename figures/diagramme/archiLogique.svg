  <text x="170" y="1102" class="box-title">Celery Workers</text>
  <text x="170" y="1128" class="box-text">Taches longues</text>
  <rect x="505" y="1076" width="290" height="68" rx="14" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="535" y="1102" class="box-title">Diff Parser</text>
  <text x="535" y="1128" class="box-text">Fichiers, hunks, lignes</text>
  <rect x="870" y="1076" width="290" height="68" rx="14" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="900" y="1102" class="box-title">Secret + Static Scan</text>
  <text x="900" y="1128" class="box-text">Ruff, Semgrep, ESLint</text>
  <rect x="1235" y="1076" width="290" height="68" rx="14" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="1265" y="1102" class="box-title">Repo Indexing</text>
  <text x="1265" y="1128" class="box-text">Chunks + embeddings</text>
  <rect x="1600" y="1076" width="290" height="68" rx="14" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="1630" y="1102" class="box-title">LLM Generation</text>
  <text x="1630" y="1128" class="box-text">Findings JSON</text>

  <rect x="70" y="1205" width="1860" height="120" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text x="105" y="1244" class="layer-title">Couche donnees et integrations externes</text>
  <rect x="130" y="1270" width="230" height="42" rx="10" fill="#334155"/>
  <text x="196" y="1297" class="pill">PostgreSQL</text>
  <rect x="400" y="1270" width="230" height="42" rx="10" fill="#334155"/>
  <text x="484" y="1297" class="pill">Neo4j</text>
  <rect x="670" y="1270" width="230" height="42" rx="10" fill="#334155"/>
  <text x="756" y="1297" class="pill">Redis</text>
  <rect x="940" y="1270" width="230" height="42" rx="10" fill="#334155"/>
  <text x="1017" y="1297" class="pill">MinIO</text>
  <rect x="1210" y="1270" width="230" height="42" rx="10" fill="#334155"/>
  <text x="1285" y="1297" class="pill">GitHub</text>
  <rect x="1480" y="1270" width="340" height="42" rx="10" fill="#334155"/>
  <text x="1534" y="1297" class="pill">Jira / Slack / Teams / SendGrid</text>

