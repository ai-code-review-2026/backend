  <text x="940" y="656" class="box-title">GitHub Webhooks</text>
  <text x="940" y="682" class="box-text">PR opened, sync, update</text>
  <rect x="1300" y="630" width="330" height="68" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1330" y="656" class="box-title">API Gateway logique</text>
  <text x="1330" y="682" class="box-text">Validation, routing, audit</text>

  <rect x="70" y="765" width="1860" height="190" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="105" y="806" class="layer-title">Couche coeur metier</text>
