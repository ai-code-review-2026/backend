  <rect x="130" y="630" width="330" height="68" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="656" class="box-title">FastAPI REST API</text>
  <text x="160" y="682" class="box-text">Endpoints applicatifs</text>
