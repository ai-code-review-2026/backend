  <text x="160" y="870" class="box-title">Workspace Service</text>
  <text x="160" y="896" class="box-text">Organisations, projets, repos</text>
  <rect x="505" y="842" width="315" height="78" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="535" y="870" class="box-title">Review Workflow</text>
  <text x="535" y="896" class="box-text">PRs, decisions, templates</text>
  <rect x="880" y="842" width="315" height="78" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="910" y="870" class="box-title">Analysis Orchestrator</text>
  <text x="910" y="896" class="box-text">Statuts, pipeline, history</text>
  <rect x="1255" y="842" width="315" height="78" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1285" y="870" class="box-title">GraphRAG Engine</text>
  <text x="1285" y="896" class="box-text">Retrieval + generation LLM</text>
  <rect x="1630" y="842" width="250" height="78" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1660" y="870" class="box-title">Notifications</text>
  <text x="1660" y="896" class="box-text">Email, Slack, Teams</text>

  <rect x="70" y="1000" width="1860" height="160" rx="22" fill="#fce7f3" stroke="#be185d" stroke-width="3"/>
  <text x="105" y="1041" class="layer-title">Couche execution asynchrone</text>
