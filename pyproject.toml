[tool.poetry]
name = "ai-code-review-backend"
version = "0.1.0"
description = "Backend service (FastAPI)"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.100,<0.137"
pydantic = "^2.10.6"
pydantic-settings = "^2.8.1"
uvicorn = {version = ">=0.22,<0.45", extras = ["standard"]}
websockets = "^16.0"
psycopg = {version = "^3.2.10", extras = ["binary"]}
psycopg-pool = "^3.2.2"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
celery = "^5.4.0"
redis = ">=5.0.8,<8.0.0"
ruff = ">=0.13,<0.16"
semgrep = "^1.132.0"
sqlfluff = ">=3,<5"
setuptools = "<83"
cryptography = "^46.0.0"
PyJWT = "^2.11.0"
prometheus-fastapi-instrumentator = "^6.1.0"
requests = "^2.32.3"
python-multipart = ">=0.0.20,<0.0.27"
langchain-core = "^1.2.19"
langchain = "^1.2.12"
langchain-community = "^0.4.1"
langgraph = "^1.1.5"
langchain-ollama = "^1.0.1"
tree-sitter = ">=0.24,<0.26"
neo4j = ">=5.28,<7.0"
pywebpush = "^2.0.3"
anthropic = ">=0.95,<0.97"
psutil = "^7.2.2"
sentence-transformers = ">=3.0,<4.0"
openai = ">=1.0,<2.0"
minio = "^7.2.0"
ragas = "^0.1.0"
datasets = "^2.14.0"
langchain-openai = "^0.0.5"
