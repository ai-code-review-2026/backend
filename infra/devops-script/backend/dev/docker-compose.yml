services:
  backend-api:
    image: your-dockerhub-username/ai-review-api:latest
    depends_on:
      - mongo
    container_name: backend-api
    env_file:
      - .env
    ports:
      - "8000:8000"

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: admin

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
