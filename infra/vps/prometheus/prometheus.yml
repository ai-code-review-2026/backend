global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "vps-node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "docker-cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "ai-review-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "ai-review-api:8000"
