networks:
  ai-review-network:
    external: true
    name: ai-review-network

volumes:
  analysis_workspace:

services:
  api:
    image: ${DOCKER_USER}/ai-review-api:latest
    container_name: ai-review-api
    restart: unless-stopped
    command: >
      /bin/sh -c "
        alembic -c /app/alembic.ini upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    env_file:
      - .env
    volumes:
      - analysis_workspace:/var/ai-review/workspace
    networks:
      - ai-review-network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  worker:
    image: ${DOCKER_USER}/ai-review-api:latest
    container_name: ai-review-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - -Q
      - analyses
      - --concurrency=2
      - --pool=prefork
    env_file:
      - .env
    volumes:
      - analysis_workspace:/var/ai-review/workspace
    networks:
      - ai-review-network
    depends_on:
      api:
        condition: service_healthy
