<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Test Landing Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* Safe area support */
    .pt-safe { padding-top: env(safe-area-inset-top); }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pl-safe { padding-left: env(safe-area-inset-left); }
    .pr-safe { padding-right: env(safe-area-inset-right); }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(to bottom, #f8fafc, white);
    }
    
    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-y: auto;
    }
    
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      padding-top: calc(2rem + env(safe-area-inset-top));
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
      text-align: center;
    }
    
    h1 {
      font-size: 2rem;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 1rem;
    }
    
    .gradient-text {
      background: linear-gradient(to right, #2563eb, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p {
      font-size: 1rem;
      color: #64748b;
      margin-bottom: 2rem;
      max-width: 32rem;
    }
    
    .button {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      margin: 0.5rem;
      width: calc(100% - 2rem);
      max-width: 20rem;
    }
    
    .button-outline {
      background: white;
      color: #2563eb;
      border: 2px solid #2563eb;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-top: 2rem;
      width: 100%;
      max-width: 32rem;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      padding: 1rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .stat-value {
      font-weight: 600;
      color: #0f172a;
    }
    
    .stat-label {
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>
        Ship Faster with<br>
        <span class="gradient-text">AI-Powered Code Review</span>
      </h1>
      
      <p>
        Get instant reviews with clear summaries and fixes. Catch bugs and security issues before they reach production.
      </p>
      
      <a href="/sign-up" class="button">Get Started Free</a>
      <a href="/dashboard" class="button button-outline">Go to Dashboard</a>
      
      <div class="stats">
        <div class="stat-card">
          <div>
            <div class="stat-value">10x Faster</div>
            <div class="stat-label">Review Speed</div>
          </div>
        </div>
        <div class="stat-card">
          <div>
            <div class="stat-value">99% Accuracy</div>
            <div class="stat-label">Bug Detection</div>
          </div>
        </div>
        <div class="stat-card">
          <div>
            <div class="stat-value">5 Minutes</div>
            <div class="stat-label">Setup Time</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
